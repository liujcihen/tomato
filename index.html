<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍅 可爱番茄钟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

  :root {
    --primary: #7ec8e3;
    --primary-light: #b8e6f0;
    --primary-dark: #5ba8c8;
    --accent: #ff6b6b;
    --accent-light: #ff8e8e;
    --bg-overlay: rgba(255, 255, 255, 0.65);
    --card-bg: rgba(255, 255, 255, 0.75);
    --text: #3a4a5a;
    --text-light: #7a8a9a;
    --shadow: 0 8px 32px rgba(126, 200, 227, 0.25);
    --radius: 24px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e0f4fa 0%, #c8e8f0 50%, #d4ecf0 100%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text);
    overflow: hidden;
    position: relative;
    transition: background 0.8s ease;
  }

  /* 浮动装饰 */
  .floating-deco {
    position: fixed;
    border-radius: 50%;
    opacity: 0.15;
    animation: floatUp 6s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }
  .floating-deco:nth-child(1) { width: 120px; height: 120px; background: var(--primary); top: 10%; left: 8%; animation-delay: 0s; }
  .floating-deco:nth-child(2) { width: 80px; height: 80px; background: var(--accent); top: 70%; right: 10%; animation-delay: 2s; }
  .floating-deco:nth-child(3) { width: 60px; height: 60px; background: var(--primary-light); top: 30%; right: 15%; animation-delay: 4s; }
  .floating-deco:nth-child(4) { width: 100px; height: 100px; background: var(--primary); bottom: 15%; left: 15%; animation-delay: 1s; }
  .floating-deco:nth-child(5) { width: 50px; height: 50px; background: var(--accent-light); top: 15%; right: 25%; animation-delay: 3s; }

  @keyframes floatUp {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }

  /* 主容器 */
  .app-container {
    position: relative;
    z-index: 1;
    width: 92%;
    max-width: 400px;
    text-align: center;
    padding: 20px;
  }

  /* 顶部标题 */
  .app-header {
    margin-bottom: 10px;
  }
  .app-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .app-title .emoji { font-size: 1.8rem; animation: bounce 2s ease infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .app-subtitle {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-top: 4px;
  }

  /* 模式切换 */
  .mode-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 18px 0;
  }
  .mode-tab {
    padding: 8px 20px;
    border-radius: 50px;
    border: 2px solid var(--primary-light);
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    color: var(--text-light);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .mode-tab.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 15px rgba(126, 200, 227, 0.4);
  }
  .mode-tab:hover:not(.active) {
    border-color: var(--primary);
    color: var(--primary-dark);
  }

  /* 计时器卡片 */
  .timer-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: var(--radius);
    padding: 35px 25px 30px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.6);
    position: relative;
    overflow: hidden;
  }

  /* 进度环 */
  .timer-ring-container {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto 25px;
  }
  .timer-ring {
    transform: rotate(-90deg);
    width: 220px;
    height: 220px;
  }
  .timer-ring-bg {
    fill: none;
    stroke: rgba(126, 200, 227, 0.2);
    stroke-width: 8;
  }
  .timer-ring-progress {
    fill: none;
    stroke: var(--primary);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease;
    filter: drop-shadow(0 0 6px rgba(126, 200, 227, 0.5));
  }
  .timer-ring-progress.break-mode {
    stroke: var(--accent);
    filter: drop-shadow(0 0 6px rgba(255, 107, 107, 0.5));
  }

  .timer-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .time-text {
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .time-label {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 6px;
  }

  /* 控制按钮 */
  .controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
  }
  .btn {
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-main {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    font-size: 1.6rem;
    box-shadow: 0 6px 20px rgba(126, 200, 227, 0.45);
  }
  .btn-main:hover { transform: scale(1.08); }
  .btn-main:active { transform: scale(0.95); }
  .btn-main.running {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
  }

  .btn-secondary {
    width: 48px;
    height: 48px;
    background: rgba(126, 200, 227, 0.15);
    color: var(--primary-dark);
    font-size: 1.2rem;
    border: 2px solid var(--primary-light);
  }
  .btn-secondary:hover { background: rgba(126, 200, 227, 0.3); }
  .btn-secondary:active { transform: scale(0.9); }

  /* 用途输入 */
  .task-input-wrapper {
    margin: 5px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(126, 200, 227, 0.08);
    border-radius: 50px;
    padding: 6px 16px;
    border: 2px solid rgba(126, 200, 227, 0.2);
    transition: border-color 0.3s;
  }
  .task-input-wrapper:focus-within {
    border-color: var(--primary);
  }
  .task-input-wrapper .task-icon {
    font-size: 1rem;
    flex-shrink: 0;
  }
  .task-input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 0.88rem;
    font-family: inherit;
    outline: none;
    padding: 4px 0;
    min-width: 0;
  }
  .task-input::placeholder {
    color: var(--text-light);
    opacity: 0.6;
  }

  /* 设置区域 */
  .settings-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(126, 200, 227, 0.1);
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 0.82rem;
    color: var(--text-light);
  }
  .setting-item input[type="number"] {
    width: 42px;
    border: none;
    background: transparent;
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 0.9rem;
    text-align: center;
    font-family: inherit;
    outline: none;
  }
  .setting-item input[type="number"]::-webkit-inner-spin-button { opacity: 1; }

  /* 统计 */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 20px;
    padding: 14px 20px;
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.5);
  }
  .stat-item {
    text-align: center;
  }
  .stat-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--primary-dark);
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* 底部按钮 */
  .bottom-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .bottom-btn {
    padding: 10px 22px;
    border-radius: 50px;
    border: 2px solid var(--primary-light);
    background: var(--card-bg);
    color: var(--primary-dark);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* 提示消息 */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--primary-dark);
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* 动画 */
  .shake { animation: shake 0.5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* 覆盖层 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }

  /* ===== 背景设置面板 ===== */
  .panel-base {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(20px);
    border-radius: 24px 24px 0 0;
    padding: 25px 20px 35px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
    max-height: 80vh;
    overflow-y: auto;
  }
  .panel-base.open { transform: translateY(0); }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    position: sticky;
    top: 0;
    background: inherit;
    backdrop-filter: blur(20px);
    padding-bottom: 10px;
    z-index: 1;
  }
  .panel-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .panel-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.05);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .panel-close:hover { background: rgba(0,0,0,0.1); }

  /* 背景选项 */
  .bg-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .bg-option {
    aspect-ratio: 16/10;
    border-radius: 14px;
    border: 3px solid transparent;
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
    position: relative;
  }
  .bg-option.active {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(126, 200, 227, 0.3);
  }
  .bg-option:hover { transform: scale(1.04); }
  .bg-option .check-icon {
    position: absolute;
    top: 6px; right: 6px;
    width: 22px; height: 22px;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
  }
  .bg-option.active .check-icon { display: flex; }

  .bg-upload-area {
    border: 2px dashed var(--primary-light);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--text-light);
  }
  .bg-upload-area:hover {
    border-color: var(--primary);
    background: rgba(126, 200, 227, 0.05);
  }
  .bg-upload-area .upload-icon { font-size: 1.8rem; margin-bottom: 6px; }
  .bg-upload-area p { font-size: 0.85rem; }

  /* ===== 记录面板 ===== */
  .records-panel { z-index: 100; }

  .records-summary {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .records-summary-item {
    background: rgba(126, 200, 227, 0.1);
    padding: 8px 16px;
    border-radius: 12px;
    text-align: center;
    min-width: 80px;
  }
  .records-summary-value {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--primary-dark);
  }
  .records-summary-label {
    font-size: 0.7rem;
    color: var(--text-light);
    margin-top: 2px;
  }

  .records-day-group {
    margin-bottom: 16px;
    text-align: left;
  }
  .records-day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(126, 200, 227, 0.12);
    border-radius: 12px 12px 0 0;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--primary-dark);
  }
  .records-day-count {
    background: var(--primary);
    color: #fff;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 50px;
    font-weight: 600;
  }
  .record-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.5);
    border-bottom: 1px solid rgba(126, 200, 227, 0.1);
    transition: background 0.2s;
  }
  .record-item:last-child {
    border-radius: 0 0 12px 12px;
    border-bottom: none;
  }
  .record-item:hover { background: rgba(126, 200, 227, 0.08); }
  .record-time {
    font-size: 0.78rem;
    color: var(--text-light);
    min-width: 52px;
    font-variant-numeric: tabular-nums;
  }
  .record-duration {
    font-size: 0.72rem;
    color: var(--primary-dark);
    background: rgba(126, 200, 227, 0.15);
    padding: 1px 8px;
    border-radius: 50px;
    white-space: nowrap;
  }
  .record-purpose {
    flex: 1;
    font-size: 0.85rem;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
  }
  .record-purpose.empty {
    color: var(--text-light);
    font-style: italic;
    opacity: 0.6;
  }
  .record-delete {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 107, 107, 0.1);
    color: var(--accent);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .record-delete:hover {
    background: var(--accent);
    color: #fff;
  }

  .records-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
  }
  .records-empty .empty-icon { font-size: 3rem; margin-bottom: 10px; }
  .records-empty p { font-size: 0.9rem; }

  .records-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  /* 暗色背景时的适配 */
  body.dark-bg .timer-card,
  body.dark-bg .stats-bar,
  body.dark-bg .panel-base {
    background: rgba(40, 50, 60, 0.92);
    border-color: rgba(255,255,255,0.15);
  }
  body.dark-bg .time-text { color: #fff; }
  body.dark-bg .app-title { color: #fff; }
  body.dark-bg .app-subtitle { color: rgba(255,255,255,0.6); }
  body.dark-bg .mode-tab { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.2); }
  body.dark-bg .mode-tab.active { background: var(--primary); color: #fff; }
  body.dark-bg .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
  body.dark-bg .task-input-wrapper { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
  body.dark-bg .task-input { color: #fff; }
  body.dark-bg .task-input::placeholder { color: rgba(255,255,255,0.4); }
  body.dark-bg .setting-item { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
  body.dark-bg .setting-item input { color: #fff; }
  body.dark-bg .stat-value { color: #fff; }
  body.dark-bg .stat-label { color: rgba(255,255,255,0.5); }
  body.dark-bg .bottom-btn { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
  body.dark-bg .panel-title { color: #fff; }
  body.dark-bg .panel-close { background: rgba(255,255,255,0.1); color: #fff; }
  body.dark-bg .panel-close:hover { background: rgba(255,255,255,0.2); }
  body.dark-bg .bg-panel-title { color: #fff; }
  body.dark-bg .bg-upload-area { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); }
  body.dark-bg .records-summary-item { background: rgba(255,255,255,0.08); }
  body.dark-bg .records-summary-value { color: #fff; }
  body.dark-bg .records-summary-label { color: rgba(255,255,255,0.5); }
  body.dark-bg .records-day-header { background: rgba(255,255,255,0.08); color: #fff; }
  body.dark-bg .record-item { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.05); }
  body.dark-bg .record-item:hover { background: rgba(255,255,255,0.06); }
  body.dark-bg .record-purpose { color: #fff; }
  body.dark-bg .record-purpose.empty { color: rgba(255,255,255,0.35); }
  body.dark-bg .record-duration { color: var(--primary-light); background: rgba(126, 200, 227, 0.15); }
  body.dark-bg .records-empty { color: rgba(255,255,255,0.4); }
  body.dark-bg .toast { background: rgba(60,70,80,0.95); color: #fff; }
</style>
</head>
<body>

<!-- 浮动装饰 -->
<div class="floating-deco"></div>
<div class="floating-deco"></div>
<div class="floating-deco"></div>
<div class="floating-deco"></div>
<div class="floating-deco"></div>

<!-- 提示 -->
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

<div class="app-container">
  <!-- 标题 -->
  <div class="app-header">
    <div class="app-title">
      <span class="emoji">🍅</span>
      <span>番茄钟</span>
      <span class="emoji">⏰</span>
    </div>
    <div class="app-subtitle" id="subtitle">专注当下，高效每一天 ✨</div>
  </div>

  <!-- 模式切换 -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="work" onclick="switchMode('work')">🎯 专注</button>
    <button class="mode-tab" data-mode="shortBreak" onclick="switchMode('shortBreak')">☕ 短休</button>
    <button class="mode-tab" data-mode="longBreak" onclick="switchMode('longBreak')">🌙 长休</button>
  </div>

  <!-- 计时器卡片 -->
  <div class="timer-card" id="timerCard">
    <!-- 用途输入 -->
    <div class="task-input-wrapper">
      <span class="task-icon">📝</span>
      <input class="task-input" id="taskInput" type="text" placeholder="这个番茄要做什么？如：写周报、看书30页…" maxlength="100">
    </div>

    <div class="timer-ring-container">
      <svg class="timer-ring" viewBox="0 0 220 220">
        <circle class="timer-ring-bg" cx="110" cy="110" r="100"/>
        <circle class="timer-ring-progress" id="progressRing" cx="110" cy="110" r="100"
          stroke-dasharray="628.3" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-display">
        <div class="time-text" id="timeDisplay">25:00</div>
        <div class="time-label" id="timeLabel">准备开始专注吧！</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="resetBtn" onclick="resetTimer()" title="重置">
        ↺
      </button>
      <button class="btn btn-main" id="startBtn" onclick="toggleTimer()">
        ▶
      </button>
      <button class="btn btn-secondary" id="skipBtn" onclick="skipTimer()" title="跳过">
        ⏭
      </button>
    </div>

    <!-- 设置 -->
    <div class="settings-row">
      <div class="setting-item">
        <span>🎯</span>
        <input type="number" id="workMin" value="25" min="1" max="60" onchange="updateDurations()">
        <span>分钟</span>
      </div>
      <div class="setting-item">
        <span>☕</span>
        <input type="number" id="shortBreakMin" value="5" min="1" max="30" onchange="updateDurations()">
        <span>分钟</span>
      </div>
      <div class="setting-item">
        <span>🔔</span>
        <input type="number" id="longBreakMin" value="15" min="1" max="60" onchange="updateDurations()">
        <span>分钟</span>
      </div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="pomodoroCount">0</div>
      <div class="stat-label">🍅 已完成</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="totalFocusTime">0</div>
      <div class="stat-label">⏱ 总专注(分)</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="currentStreak">0</div>
      <div class="stat-label">🔥 连续次数</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="todayCount">0</div>
      <div class="stat-label">📅 今日番茄</div>
    </div>
  </div>

  <!-- 底部按钮 -->
  <div class="bottom-bar">
    <button class="bottom-btn" onclick="toggleBgPanel()">
      🎨 更换背景
    </button>
    <button class="bottom-btn" onclick="toggleRecordsPanel()">
      📋 查看记录
    </button>
    <button class="bottom-btn" onclick="exportRecords()">
      💾 导出TXT
    </button>
    <button class="bottom-btn" onclick="resetStats()">
      🗑️ 清除数据
    </button>
  </div>
</div>

    </div>
    <div class="bg-option" data-bg="ocean" onclick="selectBg('ocean', this)" style="background: linear-gradient(135deg, #43e97b, #38f9d7, #43e97b);">

    </div>

<!-- 记录面板 -->
<div class="panel-base records-panel" id="recordsPanel">
  <div class="panel-header">
    <div class="panel-title">📋 番茄记录</div>
    <button class="panel-close" onclick="toggleRecordsPanel()">✕</button>
  </div>
  <div id="recordsContent"></div>
</div>

<script>
  // ========== 状态 ==========
  const state = {
    mode: 'work',
    isRunning: false,
    timeLeft: 25 * 60,
    totalTime: 25 * 60,
    workDuration: 25 * 60,
    shortBreakDuration: 5 * 60,
    longBreakDuration: 15 * 60,
    pomodoroCount: 0,
    totalFocusTime: 0,
    currentStreak: 0,
    timerInterval: null,
  };

  // 番茄记录数组: { id, date, startTime, endTime, duration(min), purpose, createdAt }
  let records = [];

  // ========== DOM ==========
  const $ = (id) => document.getElementById(id);
  const timeDisplay = $('timeDisplay');
  const timeLabel = $('timeLabel');
  const progressRing = $('progressRing');
  const startBtn = $('startBtn');
  const timerCard = $('timerCard');
  const subtitle = $('subtitle');
  const taskInput = $('taskInput');

  const circumference = 2 * Math.PI * 100;
  progressRing.style.strokeDasharray = circumference;

  // ========== 初始化 ==========
  function init() {
    loadFromStorage();
    updateDisplay();
    updateStatsDisplay();
    applySavedBg();
  }

  function loadFromStorage() {
    const saved = localStorage.getItem('pomodoroState');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
      if (state.isRunning) {
        state.isRunning = false;
        startBtn.textContent = '▶';
        startBtn.classList.remove('running');
      }
    }
    const savedRecords = localStorage.getItem('pomodoroRecords');
    if (savedRecords) {
      try { records = JSON.parse(savedRecords); } catch(e) { records = []; }
    }
  }

  function saveToStorage() {
    localStorage.setItem('pomodoroState', JSON.stringify(state));
    localStorage.setItem('pomodoroRecords', JSON.stringify(records));
  }

  // ========== 计时器核心 ==========
  function toggleTimer() {
    if (state.isRunning) { pauseTimer(); }
    else { startTimer(); }
  }

  function startTimer() {
    state.isRunning = true;
    startBtn.textContent = '⏸';
    startBtn.classList.add('running');

    state.timerInterval = setInterval(() => {
      state.timeLeft--;
      updateDisplay();
      if (state.timeLeft <= 0) { onTimerComplete(); }
    }, 1000);

    saveToStorage();
  }

  function pauseTimer() {
    state.isRunning = false;
    startBtn.textContent = '▶';
    startBtn.classList.remove('running');
    clearInterval(state.timerInterval);
    saveToStorage();
  }

  function resetTimer() {
    pauseTimer();
    state.timeLeft = state.totalTime;
    updateDisplay();
    timeLabel.textContent = getModeLabel(state.mode);
    timerCard.classList.remove('shake');
    void timerCard.offsetWidth;
  }

  function skipTimer() {
    pauseTimer();
    onTimerComplete();
  }

  function onTimerComplete() {
    pauseTimer();
    timerCard.classList.add('shake');
    playNotificationSound();

    if (state.mode === 'work') {
      // 记录一个番茄
      const now = new Date();
      const purpose = (taskInput.value || '').trim();
      const durationMin = Math.round(state.workDuration / 60);
      const record = {
        id: now.getTime() + '_' + Math.random().toString(36).slice(2, 8),
        date: formatDate(now),
        dateKey: formatDateKey(now),
        startTime: formatTime(now),
        endTime: formatTime(new Date(now.getTime() + state.workDuration * 1000)),
        duration: durationMin,
        purpose: purpose,
        timestamp: now.getTime(),
      };
      records.unshift(record);

      state.pomodoroCount++;
      state.totalFocusTime += durationMin;
      state.currentStreak++;

      // 清空输入框，准备下一个
      taskInput.value = '';

      if (state.pomodoroCount % 4 === 0) {
        showToast('🎉 完成4个番茄钟！该长休息啦～');
        switchMode('longBreak');
      } else {
        showToast('🎉 专注完成！休息一下吧 ☕');
        switchMode('shortBreak');
      }
    } else {
      showToast('💪 休息结束，继续加油！');
      switchMode('work');
    }

    updateStatsDisplay();
    saveToStorage();
  }

  // ========== 显示更新 ==========
  function updateDisplay() {
    const mins = Math.floor(state.timeLeft / 60);
    const secs = state.timeLeft % 60;
    timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

    const progress = 1 - (state.timeLeft / state.totalTime);
    const offset = circumference * (1 - progress);
    progressRing.style.strokeDashoffset = offset;

    document.title = `${timeDisplay.textContent} - 番茄钟 🍅`;
  }

  function getModeLabel(mode) {
    const labels = {
      work: '专注模式下 🎯',
      shortBreak: '短休息中 ☕',
      longBreak: '长休息中 🌙'
    };
    return labels[mode] || '';
  }

  // ========== 模式切换 ==========
  function switchMode(mode) {
    state.mode = mode;
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.mode === mode);
    });
    switch (mode) {
      case 'work':
        state.totalTime = state.workDuration;
        subtitle.textContent = '专注当下，高效每一天 ✨';
        progressRing.classList.remove('break-mode');
        break;
      case 'shortBreak':
        state.totalTime = state.shortBreakDuration;
        subtitle.textContent = '休息一下，喝杯咖啡 ☕';
        progressRing.classList.add('break-mode');
        break;
      case 'longBreak':
        state.totalTime = state.longBreakDuration;
        subtitle.textContent = '好好休息，恢复精力 🌙';
        progressRing.classList.add('break-mode');
        break;
    }
    state.timeLeft = state.totalTime;
    timeLabel.textContent = getModeLabel(mode);
    updateDisplay();
    saveToStorage();
  }

  // ========== 设置 ==========
  function updateDurations() {
    state.workDuration = parseInt($('workMin').value) * 60;
    state.shortBreakDuration = parseInt($('shortBreakMin').value) * 60;
    state.longBreakDuration = parseInt($('longBreakMin').value) * 60;
    if (!state.isRunning) { switchMode(state.mode); }
    saveToStorage();
  }

  // ========== 统计 ==========
  function updateStatsDisplay() {
    $('pomodoroCount').textContent = state.pomodoroCount;
    $('totalFocusTime').textContent = state.totalFocusTime;
    $('currentStreak').textContent = state.currentStreak;
    $('todayCount').textContent = getTodayCount();
  }

  function getTodayCount() {
    const today = formatDateKey(new Date());
    return records.filter(r => r.dateKey === today).length;
  }

  function resetStats() {
    const choice = confirm('确定要清除所有数据吗？\n包括统计数据、所有番茄记录。\n点击确定全部清除。');
    if (choice) {
      state.pomodoroCount = 0;
      state.totalFocusTime = 0;
      state.currentStreak = 0;
      records = [];
      taskInput.value = '';
      updateStatsDisplay();
      saveToStorage();
      renderRecords();
      showToast('🗑️ 全部数据已清除');
    }
  }

  // ========== 记录管理 ==========
  function deleteRecord(id) {
    if (!confirm('删除这条记录？')) return;
    const idx = records.findIndex(r => r.id === id);
    if (idx === -1) return;
    const rec = records[idx];
    records.splice(idx, 1);

    // 同步修正统计
    state.pomodoroCount = Math.max(0, state.pomodoroCount - 1);
    state.totalFocusTime = Math.max(0, state.totalFocusTime - rec.duration);
    // 连续次数：简单处理，如果删的不是最近几个就不动；这里保守地重新计算
    // 用总记录数近似
    state.currentStreak = records.length > 0 ? Math.min(state.currentStreak, records.length) : 0;

    updateStatsDisplay();
    saveToStorage();
    renderRecords();
    showToast('🗑️ 记录已删除');
  }

  function renderRecords() {
    const container = $('recordsContent');
    if (records.length === 0) {
      container.innerHTML = `
        <div class="records-empty">
          <div class="empty-icon">🍅</div>
          <p>还没有番茄记录哦<br>完成一个专注就会自动记录～</p>
        </div>`;
      return;
    }

    // 按日期分组
    const groups = {};
    records.forEach(r => {
      if (!groups[r.dateKey]) groups[r.dateKey] = [];
      groups[r.dateKey].push(r);
    });
    const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    // 汇总
    const totalTomatoes = records.length;
    const totalMinutes = records.reduce((s, r) => s + r.duration, 0);
    const todayKey = formatDateKey(new Date());
    const todayTomatoes = groups[todayKey] ? groups[todayKey].length : 0;

    let html = `
      <div class="records-summary">
        <div class="records-summary-item">
          <div class="records-summary-value">${totalTomatoes}</div>
          <div class="records-summary-label">🍅 总番茄</div>
        </div>
        <div class="records-summary-item">
          <div class="records-summary-value">${totalMinutes}</div>
          <div class="records-summary-label">⏱ 总分钟</div>
        </div>
        <div class="records-summary-item">
          <div class="records-summary-value">${todayTomatoes}</div>
          <div class="records-summary-label">📅 今日</div>
        </div>
      </div>`;

    sortedKeys.forEach(key => {
      const dayRecords = groups[key].sort((a, b) => b.timestamp - a.timestamp);
      const dayTotal = dayRecords.reduce((s, r) => s + r.duration, 0);
      const dateLabel = key === todayKey ? '📅 今天' : `📅 ${dayRecords[0].date}`;

      html += `
        <div class="records-day-group">
          <div class="records-day-header">
            <span>${dateLabel}</span>
            <span class="records-day-count">${dayRecords.length} 个番茄 · ${dayTotal} 分钟</span>
          </div>`;

      dayRecords.forEach(r => {
        const purposeText = r.purpose
          ? escapeHtml(r.purpose)
          : '<span style="opacity:0.5;">（未填写用途）</span>';
        html += `
          <div class="record-item">
            <span class="record-time">${r.startTime}</span>
            <span class="record-duration">${r.duration}分钟</span>
            <span class="record-purpose ${r.purpose ? '' : 'empty'}">${purposeText}</span>
            <button class="record-delete" onclick="deleteRecord('${r.id}')" title="删除">🗑</button>
          </div>`;
      });

      html += `</div>`;
    });

    html += `
      <div class="records-actions">
        <button class="bottom-btn" onclick="exportRecords()">💾 导出TXT</button>
      </div>`;

    container.innerHTML = html;
  }

  // ========== 导出 TXT ==========
  function exportRecords() {
    if (records.length === 0) {
      showToast('📭 暂无记录可导出');
      return;
    }

    const today = new Date();
    const dateStr = formatDateKey(today);
    let content = '';
    content += '════════════════════════════════════════\n';
    content += '        🍅 番茄钟记录导出\n';
    content += `        导出时间：${formatDate(today)} ${formatTime(today)}\n`;
    content += `        总番茄数：${records.length}\n`;
    content += `        总专注时长：${records.reduce((s, r) => s + r.duration, 0)} 分钟\n`;
    content += '════════════════════════════════════════\n\n';

    // 按日期分组
    const groups = {};
    records.forEach(r => {
      if (!groups[r.dateKey]) groups[r.dateKey] = [];
      groups[r.dateKey].push(r);
    });
    const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    sortedKeys.forEach(key => {
      const dayRecords = groups[key].sort((a, b) => a.timestamp - b.timestamp);
      const dayTotal = dayRecords.reduce((s, r) => s + r.duration, 0);
      content += `\n【${dayRecords[0].date}】共 ${dayRecords.length} 个番茄 · ${dayTotal} 分钟\n`;
      content += '─'.repeat(40) + '\n';

      dayRecords.forEach((r, i) => {
        const num = String(i + 1).padStart(2, '0');
        const purpose = r.purpose || '（未填写用途）';
        content += `  #${num}  ${r.startTime}  ${r.duration}分钟  ${purpose}\n`;
      });
      content += '\n';
    });

    content += '════════════════════════════════════════\n';
    content += '        保持专注，持续进步！💪\n';
    content += '════════════════════════════════════════\n';

    // 下载
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `番茄钟记录_${dateStr}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast('💾 记录已导出！');
  }

  // ========== 面板控制 ==========
  function toggleBgPanel() {
    const panel = $('bgPanel');
    const overlay = $('overlay');
    const isOpen = panel.classList.contains('open');
    closeAllPanels();
    if (!isOpen) {
      panel.classList.add('open');
      overlay.classList.add('show');
    }
  }

  function toggleRecordsPanel() {
    const panel = $('recordsPanel');
    const overlay = $('overlay');
    const isOpen = panel.classList.contains('open');
    closeAllPanels();
    if (!isOpen) {
      renderRecords();
      panel.classList.add('open');
      overlay.classList.add('show');
    }
  }

  function closeAllPanels() {
    $('bgPanel').classList.remove('open');
    $('recordsPanel').classList.remove('open');
    $('overlay').classList.remove('show');
  }

  // ========== 背景选择 ==========
  const bgMap = {
    default: 'linear-gradient(135deg, #e0f4fa 0%, #c8e8f0 50%, #d4ecf0 100%)',
    sky: 'linear-gradient(135deg, #a8d8ea 0%, #7ec8e3 50%, #aa96da 100%)',
    sunset: 'linear-gradient(135deg, #fbc2eb 0%, #f6a085 50%, #fbc2eb 100%)',
    ocean: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 50%, #43e97b 100%)',
    lavender: 'linear-gradient(135deg, #c3aed6 0%, #a8d8ea 50%, #c3aed6 100%)',
    night: 'linear-gradient(135deg, #2c3e50 0%, #4a6fa5 50%, #2c3e50 100%)',
    peach: 'linear-gradient(135deg, #ffd1d1 0%, #ffecd2 50%, #ffd1d1 100%)',
    mint: 'linear-gradient(135deg, #d4fc79 0%, #96e6a1 50%, #d4fc79 100%)',
    starry: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)',
  };

  function selectBg(bgKey, el) {
    document.querySelectorAll('.bg-option').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');
    if (bgKey === 'custom') return;

    const bgValue = bgMap[bgKey];
    document.body.style.background = bgValue;
    const darkBgs = ['night', 'starry'];
    document.body.classList.toggle('dark-bg', darkBgs.includes(bgKey));
    localStorage.setItem('pomodoroBg', JSON.stringify({ type: 'preset', key: bgKey, value: bgValue }));
    showToast('🎨 背景已更换');
  }

  function uploadBg(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const dataUrl = e.target.result;
      document.body.style.background = `url(${dataUrl}) center/cover no-repeat fixed`;
      document.body.classList.add('dark-bg');
      localStorage.setItem('pomodoroBg', JSON.stringify({ type: 'custom', dataUrl }));

      let customOpt = document.querySelector('.bg-option[data-bg="custom"]');
      if (!customOpt) {
        customOpt = document.createElement('div');
        customOpt.className = 'bg-option active';
        customOpt.dataset.bg = 'custom';
        customOpt.style.backgroundImage = `url(${dataUrl})`;
        customOpt.style.backgroundSize = 'cover';
        customOpt.innerHTML = '<div class="check-icon">✓</div>';
        customOpt.onclick = function() { selectCustomBg(this); };
        $('bgOptions').appendChild(customOpt);
      } else {
        customOpt.classList.add('active');
        customOpt.style.backgroundImage = `url(${dataUrl})`;
      }
      document.querySelectorAll('.bg-option').forEach(opt => {
        if (opt.dataset.bg !== 'custom') opt.classList.remove('active');
      });
      showToast('📷 自定义背景已设置');
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function selectCustomBg(el) {
    document.querySelectorAll('.bg-option').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');
    const saved = JSON.parse(localStorage.getItem('pomodoroBg'));
    if (saved && saved.type === 'custom') {
      document.body.style.background = `url(${saved.dataUrl}) center/cover no-repeat fixed`;
    }
  }

  function applySavedBg() {
    const saved = localStorage.getItem('pomodoroBg');
    if (!saved) return;
    const data = JSON.parse(saved);
    if (data.type === 'preset') {
      document.body.style.background = data.value;
      const darkBgs = ['night', 'starry'];
      document.body.classList.toggle('dark-bg', darkBgs.includes(data.key));
      const opt = document.querySelector(`.bg-option[data-bg="${data.key}"]`);
      if (opt) {
        document.querySelectorAll('.bg-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
      }
    } else if (data.type === 'custom') {
      document.body.style.background = `url(${data.dataUrl}) center/cover no-repeat fixed`;
      document.body.classList.add('dark-bg');
    }
  }

  // ========== 工具函数 ==========
  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
    return `${y}-${m}-${day} ${weekdays[d.getDay()]}`;
  }
  function formatDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function formatTime(d) {
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${h}:${m}`;
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ========== 通知音 ==========
  function playNotificationSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(523.25, ctx.currentTime);
      gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
      oscillator.start(ctx.currentTime);
      oscillator.stop(ctx.currentTime + 1.5);
      setTimeout(() => {
        const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
        const osc2 = ctx2.createOscillator();
        const gain2 = ctx2.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx2.destination);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(659.25, ctx2.currentTime);
        gain2.gain.setValueAtTime(0.3, ctx2.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx2.currentTime + 1);
        osc2.start(ctx2.currentTime);
        osc2.stop(ctx2.currentTime + 1);
      }, 300);
    } catch (e) { console.log('Audio not supported'); }

    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('🍅 番茄钟', {
        body: state.mode === 'work' ? '专注完成，休息一下吧！' : '休息结束，继续加油！',
        icon: '🍅'
      });
    } else if ('Notification' in window && Notification.permission !== 'denied') {
      Notification.requestPermission();
    }
  }

  // ========== Toast ==========
  function showToast(msg) {
    const toast = $('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ========== 键盘快捷键 ==========
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.code) {
      case 'Space': e.preventDefault(); toggleTimer(); break;
      case 'KeyR': resetTimer(); break;
      case 'KeyS': skipTimer(); break;
      case 'Escape': closeAllPanels(); break;
    }
  });

  // ========== 启动 ==========
  init();
</script>
</body>
